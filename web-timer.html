<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sleepiness Alert Timer - Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-green-400 to-blue-600 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-center mb-6 text-blue-700">Sleepiness Alert Timer</h1>
    <div class="mb-4">
      <label for="minutes" class="block text-gray-700 font-semibold mb-2">Set Timer (minutes):</label>
      <input
        type="number"
        id="minutes"
        min="1"
        max="180"
        value="25"
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <div class="flex justify-center space-x-4">
      <button
        id="startBtn"
        class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition flex items-center space-x-2"
      >
        <i class="fas fa-play"></i><span>Start</span>
      </button>
      <button
        id="stopBtn"
        class="bg-gray-300 text-gray-700 px-6 py-2 rounded hover:bg-gray-400 transition flex items-center space-x-2"
        disabled
      >
        <i class="fas fa-stop"></i><span>Stop</span>
      </button>
    </div>
    <div class="mt-6 text-center text-xl font-mono text-blue-700" id="timerDisplay">25:00</div>
  </div>

  <script>
    const minutesInput = document.getElementById('minutes');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const timerDisplay = document.getElementById('timerDisplay');

    let timer = null;
    let totalSeconds = 0;
    let remainingSeconds = 0;

    function updateDisplay(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      const minutes = parseInt(minutesInput.value, 10);
      if (isNaN(minutes) || minutes < 1 || minutes > 180) {
        alert('Please enter a valid number of minutes between 1 and 180.');
        return;
      }
      totalSeconds = minutes * 60;
      remainingSeconds = totalSeconds;
      updateDisplay(remainingSeconds);

      startBtn.disabled = true;
      stopBtn.disabled = false;
      minutesInput.disabled = true;

      timer = setInterval(() => {
        remainingSeconds--;
        updateDisplay(remainingSeconds);
        if (remainingSeconds <= 0) {
          clearInterval(timer);
          timer = null;
          startBtn.disabled = false;
          stopBtn.disabled = true;
          minutesInput.disabled = false;
          alert('You might be sleepy! Take a break.');
        }
      }, 1000);
    }

    function stopTimer() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      minutesInput.disabled = false;
      updateDisplay(totalSeconds);
    }

    startBtn.addEventListener('click', startTimer);
    stopBtn.addEventListener('click', stopTimer);

    // Initialize display
    updateDisplay(parseInt(minutesInput.value, 10) * 60);
  </script>
</body>
</html>
